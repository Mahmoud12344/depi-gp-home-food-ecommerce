name: Deploy to Azure Web App

on:
  push:
    branches:
      - deploy

env:
  AZURE_WEBAPP_NAME: 'SufraDayma'
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: depiR5gp/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Step 1: Install frontend dependencies & compile Tailwind CSS v4
      - name: Build Tailwind CSS
        working-directory: depiR5gp
        run: |
          npm ci
          npm run css:build

      # Step 2: Restore .NET packages
      - name: Restore dependencies
        run: dotnet restore depiR5gp/depiR5gp.csproj

      # Step 3: Publish ASP.NET Core application (includes compiled site.css in wwwroot)
      - name: Build and Publish
        run: dotnet publish depiR5gp/depiR5gp.csproj -c Release -o ./publish_output

      # Step 4: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish_output
